esphome:
  name: fancontrol
  on_boot:
    priority: -100
    then:
      - lambda: |-
          id(itho_hub).register_state_sensor(id(fan_state_numeric));
          id(itho_hub).register_speed_sensor(id(fanspeed));
          id(itho_hub).register_timer_sensor(id(fan_timer));
          id(itho_hub).register_controller_sensor(id(last_controller));
      - delay: 100ms
      - lambda: |-
          // Send Low command after sensors are registered to sync ESP with fan
          id(itho_hub).send_command(1);
          ESP_LOGI("itho", "Sent Low command on boot for synchronization");

esp8266:
  board: d1_mini
  framework:
    version: recommended

external_components:
  - source:
      type: local
      path: components
    components: [itho_fan]

spi:
  clk_pin: D5    # GPIO14 - CC1101 SCK
  miso_pin: D6   # GPIO12 - CC1101 MISO
  mosi_pin: D7   # GPIO13 - CC1101 MOSI

# Official ESPHome CC1101 component (ESPHome 2025.12+), configured for Itho:
# 868.2999 MHz, 2-FSK, 38.383 kBaud, 50 kHz deviation, sync word 0xAB 0xFE,
# fixed 63 byte packets, no CRC, no whitening.
cc1101:
  cs_pin: D8      # GPIO15 - CC1101 CSN
  gdo0_pin: D1    # GPIO5  - CC1101 GDO0 (packet received)
  frequency: 868.2999MHz
  modulation_type: 2-FSK
  symbol_rate: 38383
  filter_bandwidth: 203kHz
  fsk_deviation: 50kHz
  output_power: 10
  packet_mode: true
  num_preamble: 4
  sync_mode: 16/16
  sync1: 0xAB
  sync0: 0xFE
  packet_length: 63
  crc_enable: false
  whitening: false

itho_fan:
  id: itho_hub
  device_id: "10,87,81"
  device_name: "New ESP"
  remote_ids:
    - remote_id: "51,40,61"
      room_name: "Badkamer"

button:
  - platform: template
    name: "Fan Low"
    icon: "mdi:fan-speed-1"
    on_press:
      - lambda: |-
          id(itho_hub).send_command(1);
  
  - platform: template
    name: "Fan Medium"
    icon: "mdi:fan-speed-2"
    on_press:
      - lambda: |-
          id(itho_hub).send_command(2);
  
  - platform: template
    name: "Fan High"
    icon: "mdi:fan-speed-3"
    on_press:
      - lambda: |-
          id(itho_hub).send_command(3);
  
  - platform: template
    name: "Join Remote"
    icon: "mdi:remote-desktop"
    on_press:
      - lambda: |-
          id(itho_hub).send_join();
  
  - platform: template
    name: "Leave Remote"
    icon: "mdi:close-network"
    on_press:
      - lambda: |-
          id(itho_hub).send_leave();

sensor:
  - platform: template
    name: "Fan State"
    id: fan_state_numeric
    icon: "mdi:fan"

text_sensor:
  - platform: template
    name: "Fan Speed"
    id: fanspeed
    icon: "mdi:fan"
    
  - platform: template
    name: "Fan Timer Remaining"
    id: fan_timer
    icon: "mdi:timer"
    
  - platform: template
    name: "Last Control Source"
    id: last_controller
    icon: "mdi:remote"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  min_auth_mode: WPA2
  ap:
    ssid: "FALLBACK AP"
    password: "jdsh348201"

captive_portal:

logger:
  level: DEBUG

api:
  on_client_connected:
    then:
      - lambda: |-
          // Handle Home Assistant connection (republish current state only)
          ESP_LOGI("itho", "Home Assistant connected");
          id(itho_hub).on_homeassistant_connected();

ota:
  - platform: esphome

# For Home Assistant template fan configuration example, see README.md
